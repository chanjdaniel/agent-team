{
  "about": "The tools a machine needs to run the team, read by team-doctor through bin/lib/tools.jq. version_cmd is run with no shell (words split on spaces); version_pattern is an ERE whose first group is the version, matched against each line of the command's output (stdout and stderr) in turn, the first that matches giving it, so ^ and $ anchor to a line; a pattern starts at a line's start or names its tool, so another tool's version in a stray line (Node's path in a crash) is never read as this one's. pin is exact (the tools installed by the bootstrap itself); min is a floor, compared number by number (OS-package tools). pin_mismatch is the verdict on a different version than the pin (default FAIL). A tool is checked on each OS its source names (arch, macos), and the source is the package or the exact install command, which doctor prints as the fix. A tool built on GitHub has from instead of pin and source: from picks release ({repo, tag, sha256 per <os>-<arch> archive}) or fork ({repo, commit, version}), dir names where the binary goes on each OS, and bin/lib/tools.jq makes the pin and the install command from them. path names, per OS, the directory a tool that is not built on GitHub is installed into, ~ being HOME, @NVM_DIR@ nvm's directory (NVM_DIR, else ~/.nvm) and @HOMEBREW_PREFIX@ Homebrew's prefix: with each dir, it is what bin/lib/tools.jq's tool_dirs gives the library to put on PATH. show_path true makes the doctor name where it found the tool's command.",
