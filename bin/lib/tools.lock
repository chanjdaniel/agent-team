      "pin": "2.1.308",
      "pin_mismatch": "WARN",
      "source": {
        "arch": "curl -fsSL https://claude.ai/install.sh | bash -s 2.1.308",
        "macos": "curl -fsSL https://claude.ai/install.sh | bash -s 2.1.308"
      },
      "path": {
        "arch": "~/.local/bin",
        "macos": "~/.local/bin"
      }
    },
