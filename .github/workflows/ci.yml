# The code's checks on GitHub: on every pull request to dev (and to main, a release's promotion)
# and by hand. They are the gate of a PR to dev: its protection and projects.toml's required_checks
# for agent-team require each job by its id (shellcheck, test, macos, toolkits, data), so renaming
# a job changes a required check, and team-merge merges only with every one passed on the PR's head.
# The macos job runs one run per PR at a time: a re-push cancels the run it replaces. The toolkits
# job runs the toolkits' servers over stdio against a throwaway MongoDB in Docker. The data job
# refuses what the PR adds that the public repository never takes: a secret (gitleaks, over its
# commits) and a real email address or an image (bin/lib/data-check code, over what it adds),
# naming paths and kinds, never a value.
name: CI

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    env:
      SHELLCHECK_VERSION: v0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install shellcheck ${{ env.SHELLCHECK_VERSION }}
        run: |
          archive=shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz
          curl -fsSLO "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/$archive"
          echo "$SHELLCHECK_SHA256  $archive" | sha256sum -c -
          tar -xJf "$archive"
          echo "$PWD/shellcheck-$SHELLCHECK_VERSION" >>"$GITHUB_PATH"
      - run: tests/run shellcheck

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: tests/run bats

  # The bats suite on macOS, under Homebrew's Bash 5 and GNU tools (bin/lib/platform.sh).
  macos:
    runs-on: macos-26
    concurrency:
      group: macos-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    env:
      HOMEBREW_PACKAGES: bash coreutils findutils gnu-sed grep flock jq git python
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the Homebrew packages
        run: |
          # shellcheck disable=SC2086 # the list splits into formulae
          brew install $HOMEBREW_PACKAGES
          echo "$(brew --prefix)/bin" >>"$GITHUB_PATH"
      - name: Show the tools
        run: |
          bash --version | head -n 1
          python3 --version
          jq --version
          git --version
      - run: tests/run bats

  # The toolkits' servers over stdio, against a throwaway MongoDB in Docker.
  toolkits:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - run: tests/run toolkits

  # What the PR adds: no secret in its commits, no real email address, no image and no
  # node_modules/ path in its files.
  # By hand, what the ref adds since origin/dev.
  data:
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.28.0
      GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks ${{ env.GITLEAKS_VERSION }}
        run: |
          archive=gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/$archive"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum -c -
          mkdir gitleaks-bin
          tar -xzf "$archive" -C gitleaks-bin gitleaks
          echo "$PWD/gitleaks-bin" >>"$GITHUB_PATH"
      - name: Name the range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "PR_BASE=${BASE_SHA:-origin/dev}" >>"$GITHUB_ENV"
          echo "PR_HEAD=${HEAD_SHA:-HEAD}" >>"$GITHUB_ENV"
      - name: No secret in the commits
        run: gitleaks git --no-banner --redact=100 --verbose --log-opts="$PR_BASE..$PR_HEAD" .
      - name: No real email address, image or package tree in what the PR adds
        run: bin/lib/data-check code "$PR_BASE" "$PR_HEAD"
