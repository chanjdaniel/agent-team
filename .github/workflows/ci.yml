# The code's checks on GitHub: on every pull request to dev (and to main, a release's promotion)
# and by hand. They are the gate of a PR to dev: its protection and projects.toml's required_checks
# for agent-team require each job by its id (shellcheck, test, macos, toolkits), so renaming a job
# changes a required check, and team-merge merges only with every one passed on the PR's head.
# The macos job runs one run per PR at a time: a re-push cancels the run it replaces. The toolkits
# job runs the toolkits' servers over stdio against a throwaway MongoDB in Docker.
name: CI

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    env:
      SHELLCHECK_VERSION: v0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install shellcheck ${{ env.SHELLCHECK_VERSION }}
        run: |
          archive=shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz
          curl -fsSLO "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/$archive"
          echo "$SHELLCHECK_SHA256  $archive" | sha256sum -c -
          tar -xJf "$archive"
          echo "$PWD/shellcheck-$SHELLCHECK_VERSION" >>"$GITHUB_PATH"
      - run: tests/run shellcheck

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: tests/run bats

  # The bats suite on macOS, under Homebrew's Bash 5 and GNU tools (bin/lib/platform.sh).
  macos:
    runs-on: macos-26
    concurrency:
      group: macos-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    env:
      HOMEBREW_PACKAGES: bash coreutils findutils gnu-sed grep flock jq git python
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the Homebrew packages
        run: |
          # shellcheck disable=SC2086 # the list splits into formulae
          brew install $HOMEBREW_PACKAGES
          echo "$(brew --prefix)/bin" >>"$GITHUB_PATH"
      - name: Show the tools
        run: |
          bash --version | head -n 1
          python3 --version
          jq --version
          git --version
      - run: tests/run bats

  # The toolkits' servers over stdio, against a throwaway MongoDB in Docker.
  toolkits:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - run: tests/run toolkits
