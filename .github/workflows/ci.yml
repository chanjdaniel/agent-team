# The team home's checks. The job names `shellcheck`, `test` and `macos` are the required checks
# for dev (projects.toml). macOS minutes cost ten Linux ones, so the macos job runs only on pull
# requests and by hand, one run per PR at a time: a re-push cancels the run it replaces.
name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
    # Records, committed directly to dev, need no checks.
    paths-ignore:
      - "tasks/**"
      - ledger.jsonl
      - "memory/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    env:
      SHELLCHECK_VERSION: v0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install shellcheck ${{ env.SHELLCHECK_VERSION }}
        run: |
          archive=shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz
          curl -fsSLO "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/$archive"
          echo "$SHELLCHECK_SHA256  $archive" | sha256sum -c -
          tar -xJf "$archive"
          echo "$PWD/shellcheck-$SHELLCHECK_VERSION" >>"$GITHUB_PATH"
      - run: tests/run shellcheck

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: tests/run bats

  # The bats suite on macOS, under Homebrew's Bash 5 and GNU tools (bin/lib/platform.sh).
  macos:
    if: github.event_name != 'push'
    runs-on: macos-26
    concurrency:
      group: macos-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    env:
      HOMEBREW_PACKAGES: bash coreutils findutils gnu-sed grep flock jq git python
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the Homebrew packages
        run: |
          # shellcheck disable=SC2086 # the list splits into formulae
          brew install $HOMEBREW_PACKAGES
          echo "$(brew --prefix)/bin" >>"$GITHUB_PATH"
      - name: Show the tools
        run: |
          bash --version | head -n 1
          python3 --version
          jq --version
          git --version
      - run: tests/run bats
