schema_version: "1.1"
name: planner-notes-stay-out
description: A planner in a git checkout whose task directory holds its own notes reviews its spec, and no reader's search brings those notes, or their paths, before a reader.
tags: [spec-review]
context:
  scaffold_script: scaffold.sh
execution:
  model: claude-opus-5-5
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
  prompt: |
    You are the planner of task T9 on notecat, the shell tool in this directory.
    You wrote `.scratch/task/spec.md`, its ticket in `.scratch/task/tickets/` and `.scratch/task/scope.txt` from this plan: "Let `notecat archive` take an age, so a user archives only notes older than it."
    Before you send the plan for approval, run the spec review on your spec and sort its findings.
    This run has no Write or Edit tool, so instead of writing `.scratch/task/spec-review.md` and fixing the spec, reply with the whole `spec-review.md` you would write, sorted, saying in each fixed row's Evidence what you would change.
graders:
  - name: readiness-dispatched
    type: tool_used
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"spec-review:spec-readiness"'
    arm: with-only
  - name: planner-notes-unseen
    # A reader's own messages carry their Agent call's parent_tool_use_id; the planner's are null, and may read its notes.
    type: regex
    target: trace
    pattern: '(HERON-PLANNER-NOTE|\.scratch/task/(memory|plan)\.md)[^\n]*"parent_tool_use_id":"toolu_'
    match: not_contains
