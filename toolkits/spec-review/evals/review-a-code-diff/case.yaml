schema_version: "1.1"
name: review-a-code-diff
description: A reviewer asked to review a shell diff, with no spec in sight, leaves the skill alone.
tags: [spec-review]
context:
  scaffold_script: scaffold.sh
execution:
  model: claude-opus-5-5
  max_turns: 10
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
  prompt: |
    Review this diff to `lib/notecat.sh` in this directory and list your findings, each with its fix:

    ```diff
    --- a/lib/notecat.sh
    +++ b/lib/notecat.sh
    @@ -9,3 +9,9 @@ notes_dir() {
     show_note() {
       cat "$(notes_dir)/$1.txt"
     }
    +
    +# Deletes one note.
    +delete_note() {
    +  local file=$(notes_dir)/$1.txt
    +  rm -f $file
    +}
    ```
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?spec-review"'
    min: 0
    max: 0
    arm: both
