# A fixture shaped like the team home's projects.toml (2026-10-24), for the tests that read a real registry;
# its [conventioner.stack] block is the one the coordinator adds to the real registry once team-stack lands (T22).
# The project registry, read only through bin/team-project; `team-project --help` documents every key.

[conventioner]
repo = "chanjdaniel/Conventioner"
path = "Documents/projects/personal/Conventioner"
base = "dev"
delivery = "no-mistakes"
merge_method = "merge"
required_checks = []
changed_tests = "back end `cd back-end && python -m pytest <the test files of the modules you changed>` (and `scripts/real-mongo-test.sh` when you changed what its suite covers); front end `cd front-end && npx vitest run --changed origin/dev` and `npm run type-check`; E2E on your worktree's stack (`team-stack up`, then `team-stack seed`), `cd front-end && npx playwright test --only-changed=origin/dev` plus the spec files of each page and flow you changed; `python scripts/knowledge_graph.py check` when you changed `docs/`"
task_dir = ".scratch/task"
docs = ["AGENTS.md", "docs/README.md"]
toolkits = ["prod-read", "prod-write"]

[conventioner.pool]
provider = "treehouse"
lease = "scripts/th-lease.sh"
return = "scripts/th-return.sh"
slots = [
  ".treehouse/Conventioner-d4c77a/1/Conventioner",
  ".treehouse/Conventioner-d4c77a/2/Conventioner",
  ".treehouse/Conventioner-d4c77a/3/Conventioner",
  ".treehouse/Conventioner-d4c77a/4/Conventioner",
]

[conventioner.stack]
compose = "scripts/th-compose.sh"
seed = "scripts/seed_fixture.sh"
log_services = ["backend", "frontend"]
images = ["conventioner/backend", "conventioner/frontend"]
legacy_images = ["nmtest-[0-9]+-(backend|frontend)", "nmfix-.*", "nmtest-t12-.*", "conventioner-[0-9]+-(backend|frontend)"]
legacy_gate = "nmtest-[0-9]+"

[agent-team]
repo = "chanjdaniel/agent-team"
path = "agent-team"
base = "dev"
delivery = "direct-pr"
merge_method = "merge"
required_checks = ["shellcheck", "test", "toolkits", "data", "zizmor"]
changed_tests = "`tests/run shellcheck` and `tests/run bats --changed` (the bats files your change reaches, against `origin/dev` merged; on a fix round against the head the review read, `origin/<branch>` once pushed), adding `tests/run toolkits` only when you changed `servers/`, `toolkits/` or `tests/toolkits/`"
task_dir = ".scratch/task"
docs = ["CLAUDE.md"]
toolkits = []

[agent-team.pool]
provider = "git"
slots = [
  "agent-team/.claude/worktrees/1",
  "agent-team/.claude/worktrees/2",
  "agent-team/.claude/worktrees/3",
  "agent-team/.claude/worktrees/4",
  "agent-team/.claude/worktrees/5",
]

[no-mistakes]
# Daniel's fork of kunchenguid/no-mistakes, the gate's build (T34). Merge commits only: a squash
# would flatten upstream's history, and the next update from upstream would conflict on everything.
# Upstream's no-mistakes-required.yml fails any PR not raised through a gate, so GitHub's CI on the
# fork is information; team-merge runs the fork's own checks on the PR's head instead.
repo = "chanjdaniel/no-mistakes"
path = "Documents/projects/personal/no-mistakes"
base = "main"
delivery = "direct-pr"
merge_method = "merge"
required_checks = []
local_checks = ['test -z "$(gofmt -l .)"', "make lint", "go test -race ./...", "bash scripts/e2e.sh"]
changed_tests = "`go test -race` on the packages you changed (`go test -race ./internal/<pkg>/...`), `gofmt -l` on the files you changed and `go vet` on those packages; `bash scripts/e2e.sh` only when you changed the daemon, the pipeline or `internal/e2e/`"
task_dir = ".scratch/task"
docs = ["AGENTS.md"]
toolkits = []

[no-mistakes.pool]
provider = "git"
slots = [
  "Documents/projects/personal/no-mistakes/.claude/worktrees/1",
  "Documents/projects/personal/no-mistakes/.claude/worktrees/2",
  "Documents/projects/personal/no-mistakes/.claude/worktrees/3",
]
